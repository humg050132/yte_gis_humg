spring.application.name=yte_gis_humg

spring.datasource.url=jdbc:postgresql://localhost:5432/gis_doan_1
spring.datasource.username=postgres
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=none

# Đổi cổng chạy ứng dụng sang 8081
server.port=8081

# Cấu hình dừng ứng dụng an toàn (Graceful Shutdown) để giải phóng port và kết nối
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s

spring.jpa.open-in-view=false